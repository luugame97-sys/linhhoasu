 window.inspectRuntime={global:typeof GlobalManager,spine:typeof spine,entity:typeof FishEntity,res:typeof RES,config:typeof GlobalConfig,skeleton:typeof SkeletonAnimationEx};

 var cfg=data[0],resources=data[1],skins=data[2],lang=data[3],textures={};cfg.LanguageConfig=lang.LanguageConfig||lang;
 async function texture(name){if(textures[name])return textures[name];var src=resources[name];if(!src)throw Error('IMAGE_MISSING_'+name);return new Promise((resolve,reject)=>{var loader=new egret.ImageLoader;loader.addEventListener(egret.Event.COMPLETE,function(){var t=new egret.Texture;t._setBitmapData(loader.data);textures[name]=t;resolve(t);},this);loader.addEventListener(egret.IOErrorEvent.IO_ERROR,reject,this);loader.load(src);});}

 RES.getRes=name=>textures[name];RES.destroyRes=()=>true;RES.getResourceInfo=name=>({images:SpineHelper.atlasPackData[name]?.images||[]});
 RES.getResAsync=async name=>{

  var url=resources[name];if(!url)throw Error('RESOURCE_MISSING_'+name);if(/\.(png|jpg)$/.test(url))return texture(name);var r=await fetch(url);if(/\.json$/.test(url))return r.json();if(/\.atlas$/.test(url))return r.text();var bytes=await r.arrayBuffer();if(new Uint8Array(bytes)[0]===0x78){var inflated=new zlib.Inflate(new Uint8Array(bytes)).decompress();return inflated.buffer.slice(inflated.byteOffset,inflated.byteOffset+inflated.byteLength);}return bytes;

 SpineHelper.skelPackData={};SpineHelper.atlasPackData={};await SpineHelper.loadSingleSkelPack('skel_pack_bin');await SpineHelper.loadSingleAtlasPack('atlas_pack_bin');await SpineHelper.loadSingleSkelPack('skel_lang_pack_bin');await SpineHelper.loadSingleAtlasPack('atlas_lang_pack_bin');
 var originalPath=SpineHelper.getSpinePath;window.spineMissing=[];SpineHelper.getSpinePath=function(name){var result=originalPath.call(this,name);if(!result[0])spineMissing.push(name);return result;};

  }window.inspectRuntime.assetCount=objects.length;window.ready=true;
 }catch(e){errors.push(e.stack);window.inspectRuntime.missing=spineMissing;window.ready=false;}};egret.runEgret({renderMode:'webgl',audioType:0});
});

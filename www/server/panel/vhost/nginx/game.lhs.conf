server {
    listen 81;
    server_name _;
    root /linhhoasu/webgame/game;
    index index.html;
	include enable-php-72.conf;
    # ===== 静态资源 =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /update/ {
        alias /linhhoasu/webgame/game/update/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        alias /linhhoasu/webgame/game/js/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 游戏 WebSocket =====
    location /ws {
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ===== 游戏 HTTP API（gameMsg.do + /api/）=====
    location /gameMsg.do {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cổng web nhúng cùng origin để iframe/postMessage hoạt động ổn định.
    location = /web-panel {
        return 301 /web-panel/;
    }

    location ^~ /web-panel/ {
        rewrite ^/web-panel/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:88;
        proxy_http_version 1.1;
        # GM cổng 88 dùng host nội bộ để chọn đúng virtual route PHP.
        proxy_set_header Host 127.0.0.1:88;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /web-panel;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect http://127.0.0.1:88/ /web-panel/;
        proxy_redirect http://103.116.105.154:88/ /web-panel/;
    }

    # ===== 管理后台网关 =====
    location /admin/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== 分销系统 API =====
    location /dist-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 加这一段（和 /dist-api/ 不同，这个是静态页面）
    location /dist/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    access_log /www/wwwlogs/game-lhs-access.log;
    error_log  /www/wwwlogs/game-lhs-error.log;
}

# Tên miền công khai trỏ thẳng vào game gốc trên cổng 81.
server {
    listen 443 ssl http2;
    server_name lhs.mg365.fun;

    ssl_certificate     /www/server/panel/vhost/cert/lhs.mg365.fun/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/lhs.mg365.fun/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:81;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

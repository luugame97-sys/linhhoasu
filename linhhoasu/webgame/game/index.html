<script>

	(function () {

		var trigger = document.getElementById('lhs-web-popup');

		var modal = document.getElementById('lhs-web-modal');

		var frame = document.getElementById('lhs-web-modal-frame');

		if (!trigger || !modal) return;

		var giftcodeNoticeKey = 'lhs_public_giftcode_notice_v1';
		var applyGiftcodeNotice = function (hasUnclaimed) {
			var active = hasUnclaimed === true;
			trigger.classList.toggle('lhs-web-popup--giftcode-alert', active);
			trigger.setAttribute('title', active ? 'Có giftcode mới, bấm để nhập' : 'Mở cổng web');
			trigger.setAttribute('aria-label', active ? 'Có giftcode mới, bấm để nhập' : 'Mở cổng web Linh Họa Sư');
		};
		var readGiftcodeNotice = function () {
			try {
				var saved = JSON.parse(localStorage.getItem(giftcodeNoticeKey) || 'null');
				if (saved && typeof saved.hasUnclaimed === 'boolean') applyGiftcodeNotice(saved.hasUnclaimed);
			} catch (_error) {}
		};
		var pollGiftcodeAvailability = function () {
			fetch('/web-panel/api/public_giftcode_status.php', { credentials: 'include', cache: 'no-store' })
				.then(function (response) { return response.ok ? response.json() : null; })
				.then(function (remote) {
					if (!remote || remote.ok !== true) return;
					var saved = null;
					try { saved = JSON.parse(localStorage.getItem(giftcodeNoticeKey) || 'null'); } catch (_error) {}
					var revision = Number(remote.revision || 0);
					if (!saved || Number(saved.revision || 0) !== revision) {
						var next = { type: 'lhs-giftcode-status', revision: revision, hasUnclaimed: remote.available === true };
						try { localStorage.setItem(giftcodeNoticeKey, JSON.stringify(next)); } catch (_error) {}
						applyGiftcodeNotice(next.hasUnclaimed);
					}
				});
		};
		readGiftcodeNotice();
		pollGiftcodeAvailability();
		window.setInterval(pollGiftcodeAvailability, 60000);
		window.addEventListener('message', function (event) {
			if (event.origin !== window.location.origin || !event.data || event.data.type !== 'lhs-giftcode-status') return;
			var status = { type: event.data.type, revision: Number(event.data.revision || 0), hasUnclaimed: event.data.hasUnclaimed === true };
			try { localStorage.setItem(giftcodeNoticeKey, JSON.stringify(status)); } catch (_error) {}
			applyGiftcodeNotice(status.hasUnclaimed);
		});

		var dragged = false;

		var moving = false;

		var startX = 0;

		var startY = 0;

		var originLeft = 0;

		var originTop = 0;

		var idleTimer = null;

		var idleDelay = 8000;

		var clearIdle = function () {

			trigger.classList.remove('lhs-web-popup--idle-left', 'lhs-web-popup--idle-right');

		};

		var scheduleIdle = function () {

			if (idleTimer) window.clearTimeout(idleTimer);

			idleTimer = window.setTimeout(function () {

				if (moving || !modal.hidden) return scheduleIdle();

				var rect = trigger.getBoundingClientRect();

				clearIdle();

				trigger.classList.add(rect.left + rect.width / 2 < window.innerWidth / 2

					? 'lhs-web-popup--idle-left' : 'lhs-web-popup--idle-right');

			}, idleDelay);

		};

		var clampPosition = function (left, top) {

			var maxLeft = Math.max(0, window.innerWidth - trigger.offsetWidth);

			var maxTop = Math.max(0, window.innerHeight - trigger.offsetHeight);

			return {

				left: Math.min(maxLeft, Math.max(0, left)),

				top: Math.min(maxTop, Math.max(0, top))

			};

		};

		var setPosition = function (left, top, save) {

			clearIdle();

			var position = clampPosition(left, top);

			trigger.style.left = position.left + 'px';

			trigger.style.top = position.top + 'px';

			trigger.style.right = 'auto';

			trigger.style.bottom = 'auto';

			if (save) {

				try { localStorage.setItem('lhs_web_icon_position', JSON.stringify(position)); } catch (_error) {}

			}

		};

		try {

			var storedPosition = JSON.parse(localStorage.getItem('lhs_web_icon_position') || 'null');

			if (storedPosition && Number.isFinite(storedPosition.left) && Number.isFinite(storedPosition.top)) {

				setPosition(storedPosition.left, storedPosition.top, false);

			}

		} catch (_error) {}

		trigger.addEventListener('pointerdown', function (event) {

			clearIdle();

			scheduleIdle();

			moving = true;

			dragged = false;

			startX = event.clientX;

			startY = event.clientY;

			var rect = trigger.getBoundingClientRect();

			originLeft = rect.left;

			originTop = rect.top;

			trigger.setPointerCapture(event.pointerId);

		});

		trigger.addEventListener('pointermove', function (event) {

			if (!moving) return;

			var dx = event.clientX - startX;

			var dy = event.clientY - startY;

			if (Math.abs(dx) + Math.abs(dy) > 5) dragged = true;

			if (dragged) {

				event.preventDefault();

				setPosition(originLeft + dx, originTop + dy, false);

			}

		});

		var stopMoving = function (event) {

			if (!moving) return;

			moving = false;

			if (dragged) {

				var rect = trigger.getBoundingClientRect();

				setPosition(rect.left, rect.top, true);

				event.preventDefault();

			}

		};

		trigger.addEventListener('pointerup', stopMoving);

		trigger.addEventListener('pointercancel', stopMoving);

		trigger.addEventListener('pointerenter', function () {

			clearIdle();

			scheduleIdle();

		});

		trigger.addEventListener('focus', function () {

			clearIdle();

			scheduleIdle();

		});

		window.addEventListener('resize', function () {

			var rect = trigger.getBoundingClientRect();

			setPosition(rect.left, rect.top, true);

		});

		var close = function () {

			modal.hidden = true;

			modal.setAttribute('aria-hidden', 'true');

			document.body.classList.remove('lhs-web-modal-open');

			trigger.focus();

		};

		var open = function () {

			clearIdle();

			scheduleIdle();

			if (dragged) { dragged = false; return; }

			if (frame && frame.src === 'about:blank') frame.src = frame.getAttribute('data-src');

			modal.hidden = false;

			modal.setAttribute('aria-hidden', 'false');

			document.body.classList.add('lhs-web-modal-open');

			var closeButton = modal.querySelector('.lhs-web-modal__close');

			if (closeButton) closeButton.focus();

		};

		trigger.addEventListener('click', open);

		scheduleIdle();

		modal.querySelectorAll('[data-lhs-web-close]').forEach(function (node) {

			node.addEventListener('click', close);

		});

		document.addEventListener('keydown', function (event) {

			if (!modal.hidden && event.key === 'Escape') close();

		});

	}());

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 灵画师分销系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 加载动画 -->
  <div id="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">加载中...</span>
    </div>
  </div>

  <!-- 登录容器 -->
  <div class="login-container">
    <div class="login-card">
      <div class="text-center mb-4">
        <h1 class="login-title">灵画师分销系统</h1>
        <p class="login-subtitle">代理商管理平台</p>
      </div>

      <div class="btn-group w-100 mb-4" role="group">
        <button type="button" class="btn btn-primary" id="loginTab">登录</button>
        <button type="button" class="btn btn-outline-primary" id="registerTab">注册</button>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">用户名</label>
          <input 
            type="text" 
            class="form-control form-control-lg" 
            id="username" 
            placeholder="请输入用户名"
            required
          >
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">密码</label>
          <input 
            type="password" 
            class="form-control form-control-lg" 
            id="password" 
            placeholder="请输入密码"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          登录
        </button>
      </form>

      <div id="loggedInPanel" class="alert alert-info mt-3" style="display: none;">
        <div id="loggedInText" class="mb-2"></div>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-primary" id="enterBackendBtn">进入后台</button>
          <button type="button" class="btn btn-outline-secondary" id="switchAccountBtn">切换账号</button>
        </div>
      </div>

      <form id="registerForm" style="display: none;">
        <div class="mb-3">
          <label for="regUsername" class="form-label">用户名</label>
          <input type="text" class="form-control form-control-lg" id="regUsername" placeholder="3-20位用户名" required>
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label">密码</label>
          <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="至少6位密码" required>
        </div>
        <div class="mb-3">
          <label for="regPhone" class="form-label">手机（飞机）号</label>
          <input type="tel" class="form-control form-control-lg" id="regPhone" placeholder="选填，便于联系">
        </div>
        <div class="mb-4">
          <label for="parentInviteCode" class="form-label">邀请码</label>
          <input type="text" class="form-control form-control-lg" id="parentInviteCode" maxlength="6" placeholder="请输入上级邀请码" required>
          <small class="text-muted" id="inviteHint">请通过上级代理邀请链接进入，或手动填写邀请码</small>
        </div>
        <button type="submit" class="btn btn-success btn-lg w-100">
          注册代理账号
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted">
          还没有账号？请联系上级代理获取邀请链接
        </small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const query = new URLSearchParams(window.location.search);
    const inviteCodeFromUrl = (query.get('inviteCode') || query.get('invite') || query.get('code') || '').trim().toUpperCase();

    function switchAuthMode(mode) {
      const isLogin = mode === 'login';
      document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
      document.getElementById('loginTab').className = isLogin ? 'btn btn-primary' : 'btn btn-outline-primary';
      document.getElementById('registerTab').className = isLogin ? 'btn btn-outline-primary' : 'btn btn-primary';
    }

    document.getElementById('loginTab').addEventListener('click', () => switchAuthMode('login'));
    document.getElementById('registerTab').addEventListener('click', () => switchAuthMode('register'));

    if (inviteCodeFromUrl) {
      document.getElementById('parentInviteCode').value = inviteCodeFromUrl;
      document.getElementById('parentInviteCode').readOnly = true;
      document.getElementById('inviteHint').textContent = `已识别邀请码：${inviteCodeFromUrl}`;
      switchAuthMode('register');
    }

    // 登录页始终允许重新输入账号，避免同一浏览器沿用上一次代理后台身份。
    async function initLoggedInPanel() {
      if (!Auth.isLoggedIn()) {
        return;
      }

      const user = await Auth.getCurrentUser();
      if (!user) {
        api.clearToken();
        return;
      }

      document.getElementById('loggedInText').textContent = `当前已登录：${user.username}，可直接进入对应后台。`;
      document.getElementById('loggedInPanel').style.display = '';
      document.getElementById('enterBackendBtn').onclick = () => Auth.redirectToHome(user);
      document.getElementById('switchAccountBtn').onclick = () => {
        api.clearToken();
        document.getElementById('loggedInPanel').style.display = 'none';
        document.getElementById('username').focus();
      };
    }

    initLoggedInPanel();

    // 登录表单提交
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      showLoading();

      try {
        const response = await api.login(username, password);
        
        if (response.success) {
          showToast('登录成功！', 'success');
          setTimeout(() => {
            Auth.redirectToHome(response.data.agent);
          }, 500);
        } else {
          showToast(response.message || '登录失败', 'danger');
        }
      } catch (error) {
        showToast(error.message || '登录失败，请检查用户名和密码', 'danger');
      } finally {
        hideLoading();
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const phone = document.getElementById('regPhone').value.trim();
      const parentInviteCode = document.getElementById('parentInviteCode').value.trim().toUpperCase();

      if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
        showToast('手机号格式不正确', 'danger');
        return;
      }
      if (!/^[A-Za-z0-9]{6}$/.test(parentInviteCode)) {
        showToast('邀请码必须为6位字母或数字', 'danger');
        return;
      }

      showLoading();
      try {
        const response = await api.registerAgent({ username, password, phone, parentInviteCode });
        if (response.success) {
          showToast(response.message || '注册申请已提交，请等待上级审核', 'success');
          document.getElementById('username').value = username;
          switchAuthMode('login');
        } else {
          showToast(response.message || '注册失败', 'danger');
        }
      } catch (error) {
        showToast(error.message || '注册失败，请检查信息', 'danger');
      } finally {
        hideLoading();
      }
    });
  </script>
</body>
</html>

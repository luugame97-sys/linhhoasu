<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LHS Distribution Admin</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--paper:#fff;--wash:#f4f7fb;--blue:#175cd3;--green:#087443;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}header{height:62px;background:#17324d;color:#fff;display:flex;align-items:center;padding:0 24px;gap:18px}header h1{font-size:18px;margin:0}header .grow{flex:1}header button{border:1px solid #ffffff55;background:transparent;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}.user{font-size:12px;color:#d5e6ff}main{max-width:1440px;margin:0 auto;padding:24px}.error{background:#fff4f2;border:1px solid #fecdca;color:var(--red);padding:10px;border-radius:6px;margin-bottom:14px;display:none}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px}.stat{padding:16px}.stat span,.hint{color:var(--muted);font-size:12px}.stat b{display:block;font-size:25px;margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid #b8c2d0;background:#fff;color:#344054;border-radius:6px;padding:9px 13px;cursor:pointer}.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}.section{display:none}.section.active{display:block}.panel{padding:18px;margin-bottom:18px}.panel h2{font-size:16px;margin:0 0 13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #cbd5e1;border-radius:5px;padding:8px 9px;background:#fff}.toolbar button{border:0;background:var(--blue);color:#fff;border-radius:5px;padding:8px 12px;cursor:pointer}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;white-space:nowrap}th{background:#f8fafc;color:#475467;font-size:12px}.empty{padding:20px;color:var(--muted);text-align:center}.ok{color:var(--green)}.danger{color:var(--red)}@media(max-width:900px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:0 14px}}
  </style>
</head>
<body>
<header><h1>LHS Distribution Admin</h1><span id="user" class="user"></span><span class="grow"></span><button id="refresh">Refresh</button><button id="logout">Logout</button></header>
<main><div id="error" class="error"></div><section id="stats" class="grid"></section><nav id="tabs" class="tabs"><button class="active" data-tab="overview">Overview</button><button data-tab="agents">Agents</button><button data-tab="withdrawals">Withdrawals</button><button data-tab="commissions">Commissions</button><button data-tab="logs">Logs</button></nav>
<section id="overview" class="section active"><div class="panel"><h2>System summary</h2><p class="hint">This panel reads live data from the distribution database.</p></div></section>
<section id="agents" class="section"><div class="panel"><h2>Agents</h2><div class="toolbar"><input id="agentKeyword" placeholder="Username / phone / invite code"><button id="agentSearch">Search</button></div><div id="agentTable"></div></div></section>
<section id="withdrawals" class="section"><div class="panel"><h2>Withdrawals</h2><div id="withdrawalTable"></div></div></section>
<section id="commissions" class="section"><div class="panel"><h2>Commissions</h2><div id="commissionTable"></div></div></section>
<section id="logs" class="section"><div class="panel"><h2>Operation logs</h2><div id="logTable"></div></div></section></main>
<script src="js/api.js"></script><script src="js/auth.js"></script>
<script>
  const $=(id)=>document.getElementById(id);const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=(v)=>(Number(v||0)/100).toFixed(2);const date=(v)=>v?new Date(v).toLocaleString():'-';const d=(r)=>r&&r.data!==undefined?r.data:{};
  const rows=(items,cols)=>items.length?`<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No data</div>';
  function err(e){$('error').textContent=e.message||String(e);$('error').style.display='block'}function clear(){ $('error').style.display='none' }
  async function load(){clear();try{const [u,s]=await Promise.all([api.getProfile(),api.getAdminStats()]);if(!['root','admin'].includes(u.data.role))return Auth.redirectToHome(u.data);$('user').textContent=`${esc(u.data.username)} / ${esc(u.data.role)}`;const x=d(s);$('stats').innerHTML=[['Agents',x.totalAgents||0],['New today',x.todayNewAgents||0],['Recharge',money(x.totalRecharge)],['Commission',money(x.totalCommission)],['Pending withdrawals',x.pendingWithdrawals||0]].map(v=>`<div class="stat"><span>${v[0]}</span><b>${v[1]}</b></div>`).join('');await Promise.all([agents(),withdrawals(),commissions(),logs()])}catch(e){err(e)}}
  async function agents(){const x=d(await api.getAdminAgents(1,100,$('agentKeyword').value));$('agentTable').innerHTML=rows(x.data||x.list||[],[['Username',(r)=>esc(r.username)],['Role',(r)=>esc(r.role||r.businessRole)],['Level',(r)=>r.level??'-'],['Status',(r)=>esc(r.status)],['Invite',(r)=>esc(r.inviteCode)],['Created',(r)=>date(r.createdAt)]]);}
  async function withdrawals(){const x=d(await api.getAdminWithdrawals(1,100));$('withdrawalTable').innerHTML=rows(x.data||x.list||[],[['Agent',(r)=>esc(r.agentId&&r.agentId.username)],['Amount',(r)=>money(r.amount)],['Status',(r)=>esc(r.status)],['Created',(r)=>date(r.createdAt)],['Reviewed',(r)=>date(r.reviewedAt)]]);}
  async function commissions(){const x=d(await api.getAdminCommissions(1,100));$('commissionTable').innerHTML=rows(x.data||x.list||[],[['Agent',(r)=>esc(r.agentId&&r.agentId.username)],['Order',(r)=>esc(r.orderId)],['Amount',(r)=>money(r.amount)],['Commission',(r)=>money(r.commission)],['Status',(r)=>esc(r.status)],['Created',(r)=>date(r.createdAt)]]);}
  async function logs(){const x=d(await api.getAdminLogs(1,100));$('logTable').innerHTML=rows(x.data||x.list||[],[['Action',(r)=>esc(r.action)],['Operator',(r)=>esc(r.operatorUsername)],['Result',(r)=>esc(r.result)],['Time',(r)=>date(r.createdAt)],['Error',(r)=>esc(r.error)]]);}
  $('tabs').onclick=(e)=>{const b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))};$('agentSearch').onclick=agents;$('refresh').onclick=load;$('logout').onclick=()=>Auth.logout();Auth.requireAdmin().then(u=>{if(u)load()});
</script>
</body>
</html>

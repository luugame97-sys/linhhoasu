	<script>
	(function () {
		function describeRejection(reason) {
			try {
				if (reason == null) return String(reason);
				if (typeof reason !== 'object') return String(reason);
				var data = {};
				Object.keys(reason).forEach(function (key) { data[key] = reason[key]; });
				return JSON.stringify(data);
			} catch (_e) {
				return Object.prototype.toString.call(reason);
			}
		}
		function silenceEmptyPromiseRejection(event) {
			var reason = event && event.reason;
			var isRealError = reason && (reason instanceof Error || reason.stack || reason.message);
			if (!isRealError && event) {
				console.log('[LHS promise rejection]', describeRejection(reason));
				event.preventDefault && event.preventDefault();
				event.returnValue = true;
				return true;
			}
			return false;
		}
		window.onunhandledrejection = silenceEmptyPromiseRejection;
		window.addEventListener('unhandledrejection', silenceEmptyPromiseRejection, true);
	})();
	</script>

(function () {
  function hasQueryFlag(name) {
    var q = location.search || '';
    return q.indexOf(name + '=1') !== -1 || q.indexOf(name + '=true') !== -1;
  }

  var localProxyEnabled = hasQueryFlag('localProxy');
  var runtimeGuardsEnabled = hasQueryFlag('runtimeGuards') || localProxyEnabled;
  var diagEnabled = hasQueryFlag('diag') || localProxyEnabled;

  window.__LHS_RUNTIME_FLAGS__ = {
    localProxyEnabled: localProxyEnabled,
    runtimeGuardsEnabled: runtimeGuardsEnabled,
    diagEnabled: diagEnabled
  };

  window.__requestMapHeal = window.__requestMapHeal || function () { return false; };
  window._diag = function () {};
  if (!diagEnabled) return;

  var d = document.createElement('div');
  d.id = '_diag';
  d.style.cssText = 'position:fixed;top:0;left:0;z-index:999999;background:rgba(0,0,0,0.8);color:#0f0;font:12px monospace;padding:4px 8px;max-width:100%;white-space:pre-wrap;pointer-events:none;display:none';
  document.body.appendChild(d);

  var logs = [];
  window._diag = function (msg) {
    logs.push(msg);
    if (logs.length > 15) logs.shift();
    d.textContent = logs.join('\n');
  };

  function _needMapHeal(text) {
    return text.indexOf('m_Model') !== -1
      || text.indexOf('targetHandle') !== -1
      || text.indexOf('slotData') !== -1
      || text.indexOf('clearChapter') !== -1
      || text.indexOf('mapId') !== -1;
  }

  var origErr = window.onerror;
  var errCount = 0;
  window.onerror = function (msg, url, line, col, err) {
    var msgText = msg == null ? '' : String(msg);
    if (errCount < 20) {
      var detail = msg;
      if (err && err.stack) detail = err.stack.substring(0, 200);
      else if (url) detail = msg + ' @ ' + url.split('/').pop() + ':' + line + ':' + col;
      window._diag('ERR: ' + detail);
    }
    if (_needMapHeal(msgText)) {
      window.__requestMapHeal('onerror:' + msgText.substring(0, 80));
    }
    errCount++;
    if (typeof origErr === 'function') {
      return origErr.call(window, msg, url, line, col, err);
    }
    return false;
  };

  window.addEventListener('unhandledrejection', function (e) {
    var rawReason = e && e.reason;
    var isRealError = rawReason && (rawReason instanceof Error || rawReason.stack || rawReason.message);
    if (!isRealError) {
      e.preventDefault();
    }
    if (errCount < 20) {
      var reason = rawReason ? (rawReason.stack || rawReason.message || rawReason).toString() : 'unknown';
      window._diag('REJECT: ' + reason.substring(0, 150));
      if (_needMapHeal(reason)) {
        window.__requestMapHeal('rejection:' + reason.substring(0, 80));
      }
    }
    errCount++;
  });

  window._diag('diag loaded');
})();

					function buildDefaultRoleName() {
						var accountId = '';
						if (state.lastAuthResponse && state.lastAuthResponse.uid) {
							accountId = String(state.lastAuthResponse.uid);
						} else if (state.authArgs && state.authArgs.uid) {
							accountId = String(state.authArgs.uid);
						}
						accountId = accountId.replace(/[^0-9a-zA-Z_]/g, '');
						if (accountId.length > 8) {
							accountId = accountId.slice(accountId.length - 8);
						}
						return accountId ? ('灵画师_' + accountId) : '';

							http.__serverRoleFlowRawSdkAuth.call(
								http,
								state.authArgs.firstName,
								state.authArgs.token,
								state.authArgs.uid,
								state.authArgs.extend,
								state.authArgs.keepGuest

						).then(function(resp) {
							state.lastAuthResponse = normalizeAuthResponse(resp);

						});

								}

					}

					var originRequestJson = http.requestJson;
					http.requestJson = function(cmd, params, callback) {

							state.lastAuthResponse = normalizeAuthResponse(resp);

						});
					};

					var originStartLoadGame = main.StartLoadGame;
					main.StartLoadGame = function(serverInfo) {
						var targetServer = serverInfo || state.pendingServer || getLoginInfo().ServerInfo;
						if (!targetServer || !state.authArgs) {

							showLoading(false);
							if (!resp || toSafeInt(resp.ret, -1) !== 0) {
								throw new Error(resp && (resp.errInfo || resp.strMsgTxt) || '进入游戏失败');
							}

				if (!patchServerRoleFlow()) {

					var serverRoleFlowTimer = setInterval(function() {

			} catch (e) {

			try {
				function patchMainlineBattleFinish() {
					var gm = window.W || window.GlobalManager;
					var raidModel = gm && gm.RaidModel;
					if (!raidModel || typeof raidModel.doBattleAction !== 'function') return false;
					if (raidModel.__mainlineBattleFinishPatchV2) return true;

					function toSafeInt(value, fallback) {
						var num = Number(value);
						return isFinite(num) ? Math.floor(num) : fallback;
					}

					function patchMainlineBattleMinDuration() {
						var battleProto = window.BattleRaid && window.BattleRaid.prototype;
						if (!battleProto || typeof battleProto.ExeFinishAction !== 'function') return false;

						battleProto.ExeFinishAction = function() {

								var waitMs = raidType === 1 && turnData.length > 1 && startedAt > 0
									? MAINLINE_BATTLE_MIN_MS - (Date.now() - startedAt)

					}

						try {
							if (toSafeInt(fightResult && fightResult.type, 0) !== 1) return result;

							if (Array.isArray(fightResult && fightResult.events) && fightResult.events.length > 0) {

							}

							var self = this;
							var attempts = 0;

							function tryFinishEmptyBattle() {
								attempts++;
								try {
									var battleRaid = self && typeof self.GetBattleRaid === 'function'
										? self.GetBattleRaid()
										: null;
									if (!battleRaid || typeof battleRaid.FinishBattle !== 'function') return;

									var turnData = Array.isArray(battleRaid.m_TurnData) ? battleRaid.m_TurnData : [];
									var turnId = typeof battleRaid.GetTurnId === 'function'
										? toSafeInt(battleRaid.GetTurnId(), -1)
										: -1;

									if (turnData.length === 0 && turnId === 0) {
										battleRaid.FinishBattle();
										return;
									}

										setTimeout(tryFinishEmptyBattle, 500);
									}
								} catch (_e) {}
							}

						} catch (_e) {}

			try {
				function normalizeRoleSex(raw) {

									showData.subJob = safeSex;
